<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="How Beam differs from existing input methods">
<title>How Beam differs from existing input methods</title>
<style>
  .bg{fill:#ffffff} .card{fill:#f6f8fa;stroke:#d0d7de} .t{fill:#1f2328} .m{fill:#59636e}
  .acc{fill:#eef4ff;stroke:#4f6bed} .accb{fill:#4f6bed} .acct{fill:#3b55d9} .on{fill:#ffffff}
  .rime{fill:#f3f7f1;stroke:#6f9a5d} .rimet{fill:#4e7a3c} .cloud{fill:#fff6ec;stroke:#d98a35}
  .cloudt{fill:#b5651d} .bad{fill:#b42318} .ln{stroke:#8c959f;fill:none} .ah{fill:#8c959f}
  .sep{stroke:#d0d7de}
  text{font-family:'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',sans-serif} .mono{font-family:'JetBrains Mono','Cascadia Mono','DejaVu Sans Mono',monospace}
  @media (prefers-color-scheme: dark) {
    .bg{fill:#0d1117} .card{fill:#161b22;stroke:#30363d} .t{fill:#e6edf3} .m{fill:#9198a1}
    .acc{fill:#18213f;stroke:#7d93ff} .accb{fill:#5b74f0} .acct{fill:#9aabff}
    .rime{fill:#152015;stroke:#5f8a4e} .rimet{fill:#8cc477} .cloud{fill:#261a0d;stroke:#b8762d}
    .cloudt{fill:#f0a95c} .bad{fill:#ff7b72} .ln{stroke:#6e7681} .ah{fill:#6e7681}
    .sep{stroke:#30363d}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>
<rect class="bg" width="1000" height="560" rx="12"/>
<text class="t" x="30" y="44" font-size="22" text-anchor="start" font-weight="700">How Beam differs from existing input methods</text>
<rect class="rime" x="25" y="66" width="300" height="230" rx="12" stroke-width="1.5"/>
<text class="rimet" x="41" y="94" font-size="18" text-anchor="start" font-weight="700">Classic pinyin IME</text>
<text class="m" x="41" y="114" font-size="12" text-anchor="start" font-weight="400">dictionary + frequency / n-gram (e.g. Rime Ice)</text>
<rect class="card" x="41" y="128" width="268" height="32" rx="7" stroke-width="1.5"/>
<text class="t" x="175" y="149" font-size="13" text-anchor="middle" font-weight="400">split keys into syllables</text>
<path class="ln" d="M175 160L175 171" stroke-width="1.6" marker-end="url(#a)"/>
<rect class="card" x="41" y="172" width="268" height="32" rx="7" stroke-width="1.5"/>
<text class="t" x="175" y="193" font-size="13" text-anchor="middle" font-weight="400">look up words and phrases</text>
<path class="ln" d="M175 204L175 215" stroke-width="1.6" marker-end="url(#a)"/>
<rect class="card" x="41" y="216" width="268" height="32" rx="7" stroke-width="1.5"/>
<text class="t" x="175" y="237" font-size="13" text-anchor="middle" font-weight="400">join by frequency</text>
<text class="rimet" x="41" y="280" font-size="12" text-anchor="start" font-weight="600">local · instant · needs dictionary entries</text>
<rect class="cloud" x="350" y="66" width="300" height="230" rx="12" stroke-width="1.5"/>
<text class="cloudt" x="366" y="94" font-size="18" text-anchor="start" font-weight="700">Cloud AI input</text>
<text class="m" x="366" y="114" font-size="12" text-anchor="start" font-weight="400">large model on a server</text>
<rect class="card" x="366" y="128" width="268" height="32" rx="7" stroke-width="1.5"/>
<text class="t" x="500" y="149" font-size="13" text-anchor="middle" font-weight="400">send keys and context to a server</text>
<path class="ln" d="M500 160L500 171" stroke-width="1.6" marker-end="url(#a)"/>
<rect class="card" x="366" y="172" width="268" height="32" rx="7" stroke-width="1.5"/>
<text class="t" x="500" y="193" font-size="13" text-anchor="middle" font-weight="400">cloud model generates</text>
<path class="ln" d="M500 204L500 215" stroke-width="1.6" marker-end="url(#a)"/>
<rect class="card" x="366" y="216" width="268" height="32" rx="7" stroke-width="1.5"/>
<text class="t" x="500" y="237" font-size="13" text-anchor="middle" font-weight="400">candidates over the network</text>
<text class="cloudt" x="366" y="280" font-size="12" text-anchor="start" font-weight="600">needs network · input leaves the machine</text>
<rect class="acc" x="675" y="66" width="300" height="230" rx="12" stroke-width="1.5"/>
<text class="acct" x="691" y="94" font-size="18" text-anchor="start" font-weight="700">Beam</text>
<text class="m" x="691" y="114" font-size="12" text-anchor="start" font-weight="400">keys-conditioned local language model</text>
<rect class="card" x="691" y="128" width="268" height="32" rx="7" stroke-width="1.5"/>
<text class="t" x="825" y="149" font-size="13" text-anchor="middle" font-weight="400">keys + last 64 characters</text>
<path class="ln" d="M825 160L825 171" stroke-width="1.6" marker-end="url(#a)"/>
<rect class="card" x="691" y="172" width="268" height="32" rx="7" stroke-width="1.5"/>
<text class="t" x="825" y="193" font-size="13" text-anchor="middle" font-weight="400">0.6B model writes the sentence</text>
<path class="ln" d="M825 204L825 215" stroke-width="1.6" marker-end="url(#a)"/>
<rect class="card" x="691" y="216" width="268" height="32" rx="7" stroke-width="1.5"/>
<text class="t" x="825" y="237" font-size="13" text-anchor="middle" font-weight="400">beam search → 5 candidates</text>
<text class="acct" x="691" y="280" font-size="12" text-anchor="start" font-weight="600">local · GPU optional · ~50–150 ms on a 780M</text>
<rect class="card" x="25" y="322" width="950" height="182" rx="10" stroke-width="1.5"/>
<text class="m" x="45" y="350" font-size="13" text-anchor="start" font-weight="600">Keys</text>
<text class="rimet" x="345" y="350" font-size="13" text-anchor="start" font-weight="600">Rime Ice first candidate</text>
<text class="acct" x="665" y="350" font-size="13" text-anchor="start" font-weight="600">Beam first candidate</text>
<path class="sep" d="M37 362L963 362" stroke-width="1"/>
<text class="t mono" x="45" y="392" font-size="16" text-anchor="start" font-weight="600">wmqcfb</text>
<text class="bad" x="345" y="392" font-size="16" text-anchor="start" font-weight="400">唯美清纯发布</text>
<text class="acct" x="665" y="392" font-size="16" text-anchor="start" font-weight="700">我们去吃饭吧</text>
<text class="t mono" x="45" y="424" font-size="16" text-anchor="start" font-weight="600">jtwsqcfb</text>
<text class="bad" x="345" y="424" font-size="16" text-anchor="start" font-weight="400">今天晚上其次伐兵</text>
<text class="acct" x="665" y="424" font-size="16" text-anchor="start" font-weight="700">今天晚上去吃饭吧</text>
<text class="t mono" x="45" y="456" font-size="16" text-anchor="start" font-weight="600">yonglinux</text>
<text class="bad" x="345" y="456" font-size="16" text-anchor="start" font-weight="400">用力奴性</text>
<text class="acct" x="665" y="456" font-size="16" text-anchor="start" font-weight="700">用Linux</text>
<text class="t mono" x="45" y="488" font-size="16" text-anchor="start" font-weight="600">sjwl</text>
<text class="m" x="97" y="488" font-size="12" text-anchor="start" font-weight="400">context “up late again”</text>
<text class="t" x="345" y="488" font-size="16" text-anchor="start" font-weight="400">神经网络</text>
<text class="acct" x="665" y="488" font-size="16" text-anchor="start" font-weight="700">睡觉晚了</text>
<text class="m" x="25" y="530" font-size="11.5" text-anchor="start" font-weight="400">Measured: Rime Ice with a fresh user dictionary and no context; Beam 0.1.0-beta.2 release model. The cloud column is a generic sketch, not a specific product.</text>
</svg>
