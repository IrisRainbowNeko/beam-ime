name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: sudo apt-get update && sudo apt-get install -y ninja-build nlohmann-json3-dev python3-yaml
      - run: python3 -m pip install pypinyin==0.55.0
      - run: bash tools/build.sh tests
  windows-files:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - shell: pwsh
        run: ./tests/windows-files.ps1
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build git pkg-config libboost-all-dev nlohmann-json3-dev librime-dev libgoogle-glog-dev libx11-dev libvulkan-dev glslc spirv-headers python3-yaml
      - run: python3 -m pip install pypinyin==0.55.0
      - run: bash tools/build.sh release
        env: {CMAKE_BUILD_PARALLEL_LEVEL: '2'}
      - run: python3 tools/package_linux.py --format deb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: ubuntu-package, path: 'dist/*'}
