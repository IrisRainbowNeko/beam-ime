name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: sudo apt-get update && sudo apt-get install -y ninja-build nlohmann-json3-dev python3-yaml libsqlite3-dev
      - run: python3 -m pip install pypinyin==0.55.0
      - run: bash tools/build.sh tests
  learning:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build git libvulkan-dev glslc spirv-headers libsqlite3-dev libssl-dev
      - run: python3 -m pip install numpy==2.2.6 PyYAML==6.0.2
      - run: python3 tools/build_learning.py --jobs 2
  windows-files:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - shell: powershell
        run: |
          ./tests/windows-files.ps1
          ./tests/windows-setup.ps1
      - shell: pwsh
        run: |
          ./tests/windows-files.ps1
          ./tests/windows-setup.ps1
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build git pkg-config libboost-all-dev nlohmann-json3-dev librime-dev libgoogle-glog-dev libx11-dev libvulkan-dev glslc spirv-headers python3-yaml libsqlite3-dev libssl-dev bubblewrap
      - run: python3 -m pip install pypinyin==0.55.0
      - run: bash tools/build.sh release
        env: {CMAKE_BUILD_PARALLEL_LEVEL: '2'}
      - name: Rime bilingual mode and commit isolation
        run: |
          # Ubuntu 24.04 runners keep unprivileged user namespaces from bwrap (the test's sandbox).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          cmake --build build/release --target rime_smoke
          BEAM_TEST_RIME_BUILD="$PWD/build/release" python3 -m unittest discover -s tests -p test_rime_translation.py -v
      - run: python3 tools/package_linux.py --format deb
      - run: sudo apt-get install -y ./dist/*.deb && beamd --version && beamctl doctor
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: ubuntu-package, path: 'dist/*'}
  fedora:
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - run: dnf -y --setopt=install_weak_deps=False install gcc-c++ cmake ninja-build git pkgconf-pkg-config boost-devel json-devel librime-devel librime-lua fcitx5-rime glog-devel libX11-devel vulkan-headers vulkan-loader-devel glslc spirv-headers-devel python3 python3-pyyaml python3-pip rpm-build redhat-rpm-config add-determinism linkdupes sqlite-devel openssl-devel
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: python3 -m pip install --break-system-packages pypinyin==0.55.0
      - run: bash tools/build.sh release -DCMAKE_INSTALL_LIBDIR=lib64
        env: {CMAKE_BUILD_PARALLEL_LEVEL: '2'}
      - run: python3 tools/package_linux.py --format rpm
      - run: dnf -y --setopt=install_weak_deps=False install ./dist/*.rpm && beamd --version && beamctl doctor
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: fedora-package, path: 'dist/*'}
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: brew install ninja nlohmann-json
      - run: python3 -m pip install --break-system-packages pypinyin==0.55.0 PyYAML==6.0.2
      - run: bash packaging/macos/build.sh deps build squirrel package
      - name: Package contents
        run: |
          pkgutil --expand-full dist/Beam-*-macos-arm64.pkg /tmp/beam-pkg
          beam="/tmp/beam-pkg/beam.pkg/Payload/Library/Application Support/Beam"
          "$beam/bin/beamd" --version
          bash -n "$beam/bin/beamctl"
          codesign --verify --strict "$beam/lib/beam-ime/rime-plugins/librime-beam.dylib"
          otool -L "$beam/lib/beam-ime/rime-plugins/librime-beam.dylib"
      - name: Install, check and uninstall
        run: |
          app="/Library/Input Methods/Squirrel.app"
          # The official Squirrel first, as a user would have it; uninstall must give back exactly this.
          sudo installer -pkg build/macos/downloads/Squirrel-*.pkg -target /
          (cd "$app" && sudo find . -type f -exec shasum -a 256 {} + | sort) > /tmp/squirrel-before.txt
          # Squirrel's own postinstall deploys into SharedSupport/build, so even the official app fails
          # the strict check; uninstall only has to leave it in the same state.
          { codesign --verify --strict --verbose=4 "$app" 2>&1 || true; } | sort > /tmp/verify-before.txt
          sudo installer -pkg dist/Beam-*-macos-arm64.pkg -target / || { cat /Library/Logs/Beam/install.log; exit 1; }
          cat /Library/Logs/Beam/install.log
          codesign --verify --strict --verbose "/Library/Input Methods/Squirrel.app"
          codesign -d --entitlements - "/Library/Input Methods/Squirrel.app"
          grep -q back_image_slice "/Library/Input Methods/Squirrel.app/Contents/MacOS/Squirrel"
          ls "/Library/Input Methods/Squirrel.app/Contents/Frameworks/rime-plugins"
          "/Library/Application Support/Beam/bin/beamctl" doctor || true
          sudo "/Library/Application Support/Beam/bin/beamctl" uninstall
          test ! -e "/Library/Application Support/Beam"
          (cd "$app" && sudo find . -type f -exec shasum -a 256 {} + | sort) > /tmp/squirrel-after.txt
          diff /tmp/squirrel-before.txt /tmp/squirrel-after.txt
          { codesign --verify --strict --verbose=4 "$app" 2>&1 || true; } | sort > /tmp/verify-after.txt
          diff /tmp/verify-before.txt /tmp/verify-after.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: macos-package, path: 'dist/*'}
  squirrel-skin:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: 1.1.2
            patch: back-image.patch
            os: macos-15
          - ref: master  # NSGlassEffectView needs the macOS 26 SDK
            patch: back-image-upstream.patch
            os: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: bash packaging/macos/squirrel/build.sh ${{ matrix.ref }} packaging/macos/squirrel/${{ matrix.patch }} /tmp/squirrel-skin render
      - name: Lint as upstream does
        if: matrix.ref == 'master'
        run: |
          brew install swiftlint periphery
          cd /tmp/squirrel-skin/squirrel
          swiftlint
          periphery scan --relative-results --skip-build --index-store-path build/Index.noindex/DataStore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: squirrel-skin-${{ matrix.ref }}
          path: |
            /tmp/squirrel-skin/render
            /tmp/squirrel-skin/squirrel/build/Build/Products/Release/Squirrel.app/Contents/MacOS/Squirrel
