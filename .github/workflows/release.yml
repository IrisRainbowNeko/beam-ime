name: Release packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag
        required: true
        default: v0.1.0-beta.2
      ref:
        description: Optional source ref before the version tag is created
        required: false
        default: ''
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ inputs.ref || inputs.tag || github.ref_name }}'}
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build git pkg-config libboost-all-dev nlohmann-json3-dev librime-dev libgoogle-glog-dev libx11-dev libvulkan-dev glslc spirv-headers python3-yaml
      - run: python3 -m pip install pypinyin==0.55.0
      - run: bash tools/build.sh release
        env: {CMAKE_BUILD_PARALLEL_LEVEL: '2'}
      - name: Download released model
        run: |
          python3 -c "import json, urllib.request; m=json.load(open('models/default.json')); urllib.request.urlretrieve(m['url'], 'models/'+m['filename'])"
      - run: python3 tools/package_linux.py --format deb --model models/beam-0.6b-q8_0.gguf
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: ubuntu-release, path: 'dist/*'}
  arch-windows:
    runs-on: ubuntu-24.04
    container: archlinux:base
    steps:
      - run: pacman -Syu --noconfirm base-devel cmake ninja git boost nlohmann-json librime fcitx5-rime vulkan-headers vulkan-icd-loader shaderc spirv-headers python python-yaml python-pip mingw-w64-gcc wine xorg-server-xvfb xorg-xauth 7zip github-cli
      - run: python -m pip install --break-system-packages pypinyin==0.55.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ inputs.ref || inputs.tag || github.ref_name }}'}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bash tools/build.sh release
        env: {CMAKE_BUILD_PARALLEL_LEVEL: '2'}
      - name: Download released model
        run: |
          python -c "import json, urllib.request; m=json.load(open('models/default.json')); urllib.request.urlretrieve(m['url'], 'models/'+m['filename'])"
      - run: python tools/package_linux.py --format arch --model models/beam-0.6b-q8_0.gguf
      - run: bash packaging/windows/build.sh deps rime beamd
        env: {CMAKE_BUILD_PARALLEL_LEVEL: '2'}
      - run: python tools/collect_licenses.py && xvfb-run -a python tools/package_windows.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: arch-windows-release, path: 'dist/*'}
  fedora:
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - run: dnf -y --setopt=install_weak_deps=False install gcc-c++ cmake ninja-build git pkgconf-pkg-config boost-devel json-devel librime-devel librime-lua fcitx5-rime glog-devel libX11-devel vulkan-headers vulkan-loader-devel glslc spirv-headers-devel python3 python3-pyyaml python3-pip rpm-build redhat-rpm-config
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ inputs.ref || inputs.tag || github.ref_name }}'}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: python3 -m pip install --break-system-packages pypinyin==0.55.0
      - run: bash tools/build.sh release -DCMAKE_INSTALL_LIBDIR=lib64
        env: {CMAKE_BUILD_PARALLEL_LEVEL: '2'}
      - name: Download released model
        run: |
          python3 -c "import json, urllib.request; m=json.load(open('models/default.json')); urllib.request.urlretrieve(m['url'], 'models/'+m['filename'])"
      - run: python3 tools/package_linux.py --format rpm --model models/beam-0.6b-q8_0.gguf
      - run: dnf -y --setopt=install_weak_deps=False install ./dist/*.rpm && beamd --version && beamctl doctor
      - name: Test installed CPU daemon
        run: BEAM_TEST_MODEL="$PWD/models/beam-0.6b-q8_0.gguf" BEAM_TEST_BINARY=/usr/bin/beamd python3 -m unittest discover -s tests -p test_daemon.py -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: fedora-release, path: 'dist/*'}
  draft:
    needs: [ubuntu, arch-windows, fedora]
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ inputs.ref || inputs.tag || github.ref_name }}'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {path: dist, merge-multiple: true}
      - name: Source and release metadata
        run: |
          VERSION=$(cat VERSION)
          git archive --format=tar.gz --prefix="beam-ime-$VERSION/" -o "dist/beam-ime-$VERSION-source.tar.gz" HEAD
          cp dependencies.lock.json THIRD_PARTY_NOTICES.md dist/
          cp models/default.json dist/model-manifest.json
          cp packaging/linux/PKGBUILD dist/
          python3 tools/checksums.py dist --model-manifest models/default.json
      - name: Upload packages
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --prerelease --target "$(git rev-parse HEAD)" --title "Beam $TAG" --notes-file docs/release-notes.md
          gh release edit "$TAG" --notes-file docs/release-notes.md
          gh release upload "$TAG" dist/* --clobber
        env: {GH_TOKEN: '${{ github.token }}', TAG: '${{ inputs.tag || github.ref_name }}'}
